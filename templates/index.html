<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Vision AI — Industrial Vision Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  :root {
    --void: #0B0E11;
    --panel: #14181D;
    --panel-raised: #1C2127;
    --hairline: #262C33;
    --cyan: #00D9C6;
    --cyan-dim: rgba(0, 217, 198, 0.12);
    --ok: #3ECF8E;
    --ng: #FF5C5C;
    --text-primary: #E6EAEE;
    --text-muted: #6B7480;
    --text-faint: #454C56;
    --font-ui: 'IBM Plex Sans', sans-serif;
    --font-data: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--void);
    color: var(--text-primary);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .toolbar {
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--hairline);
    gap: 20px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
  }

  .brand i { color: var(--cyan); font-size: 18px; }

  .toolbar-divider {
    width: 1px;
    height: 20px;
    background: var(--hairline);
  }

  .module-select {
    background: var(--panel-raised);
    border: 1px solid var(--hairline);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 4px;
  }

  .toolbar-spacer { flex: 1; }

  .backend-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-data);
    font-size: 12px;
    color: var(--text-muted);
    padding: 4px 10px;
    background: var(--panel-raised);
    border-radius: 4px;
    border: 1px solid var(--hairline);
  }

  .backend-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
  }

  .main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .tool-rail {
    width: 56px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 4px;
  }

  .tool-btn {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 19px;
    cursor: pointer;
    position: relative;
    border: 1px solid transparent;
  }

  .tool-btn.active {
    background: var(--cyan-dim);
    color: var(--cyan);
    border-color: rgba(0, 217, 198, 0.3);
  }

  .tool-btn.disabled {
    color: var(--text-faint);
    cursor: not-allowed;
  }

  .tool-btn:not(.disabled):not(.active):hover {
    background: var(--panel-raised);
    color: var(--text-primary);
  }

  .viewport-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #000;
    background-image:
      linear-gradient(var(--hairline) 1px, transparent 1px),
      linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: center;
  }

  .viewport-frame {
    position: relative;
    width: min(90%, 960px);
    aspect-ratio: 4 / 3;
    background: #000;
    overflow: hidden;
  }

  .viewport-frame img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .viewport-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-faint);
    font-family: var(--font-data);
    font-size: 12px;
  }

  .viewport-placeholder i { font-size: 32px; }

  .reticle {
    position: absolute;
    width: 24px;
    height: 24px;
    pointer-events: none;
  }
  .reticle.tl { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .reticle.tr { top: -1px; right: -1px; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
  .reticle.bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .reticle.br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

  .scanline {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.7;
    animation: sweep 3.2s linear infinite;
    pointer-events: none;
  }

  @keyframes sweep {
    0%   { top: 0%; }
    100% { top: 100%; }
  }

  .scanline.paused { animation-play-state: paused; opacity: 0.15; }

  .viewport-controls {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }

  .vp-btn {
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: 4px;
    border: 1px solid var(--hairline);
    background: rgba(20, 24, 29, 0.9);
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .vp-btn.primary { border-color: var(--cyan); color: var(--cyan); }
  .vp-btn:hover { background: var(--panel-raised); }

  .inspector {
    width: 280px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .inspector-section {
    padding: 16px;
    border-bottom: 1px solid var(--hairline);
  }

  .inspector-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 0 0 12px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    font-size: 13px;
  }

  .stat-row .label { color: var(--text-muted); }
  .stat-row .value { font-family: var(--font-data); color: var(--text-primary); }
  .stat-row .value.accent { color: var(--cyan); }

  .field { margin-bottom: 14px; }

  .field-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .field-label .field-value {
    font-family: var(--font-data);
    color: var(--text-primary);
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--cyan);
    background: transparent;
  }

  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    padding: 6px 0;
  }

  .switch {
    width: 32px;
    height: 18px;
    border-radius: 9px;
    background: var(--hairline);
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
  }
  .switch.on { background: var(--cyan); }
  .switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--void);
    transition: transform 0.15s;
  }
  .switch.on::after { transform: translateX(14px); }

  .console {
    height: 140px;
    flex-shrink: 0;
    background: var(--panel);
    border-top: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
  }

  .console-header {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    border-bottom: 1px solid var(--hairline);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .console-body {
    flex: 1;
    overflow-y: auto;
    padding: 6px 12px;
    font-family: var(--font-data);
    font-size: 12px;
    line-height: 1.7;
  }

  .console-line { display: flex; gap: 10px; }
  .console-line .ts { color: var(--text-faint); flex-shrink: 0; }
  .console-line .msg { color: var(--text-muted); }
  .console-line.ok .msg { color: var(--ok); }
  .console-line.warn .msg { color: var(--ng); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

  <div class="toolbar">
    <div class="brand"><i class="ti ti-viewfinder"></i>PI VISION AI</div>
    <div class="toolbar-divider"></div>
    <select class="module-select" id="moduleSelect">
      <option value="core-object-detection">Object Detection</option>
    </select>
    <div class="toolbar-spacer"></div>
    <div class="backend-badge"><span class="dot"></span><span id="backendLabel">CPU backend</span></div>
  </div>

  <div class="main">

    <div class="tool-rail">
      <div class="tool-btn active" title="Object detection"><i class="ti ti-box-multiple"></i></div>
      <div class="tool-btn disabled" title="Measurement (coming soon)"><i class="ti ti-ruler-2"></i></div>
      <div class="tool-btn disabled" title="Color analysis (coming soon)"><i class="ti ti-color-swatch"></i></div>
      <div class="tool-btn disabled" title="OCR (coming soon)"><i class="ti ti-abc"></i></div>
      <div class="tool-btn disabled" title="Motion (coming soon)"><i class="ti ti-wave-sine"></i></div>
      <div class="tool-btn disabled" title="Shape (coming soon)"><i class="ti ti-shape"></i></div>
    </div>

    <div class="viewport-area">
      <div class="viewport-frame" id="viewportFrame">
        <div class="viewport-placeholder" id="viewportPlaceholder">
          <i class="ti ti-camera-off"></i>
          <span>NO SIGNAL — PRESS START</span>
        </div>
        <img id="streamImg" style="display:none;" alt="Live object detection stream">
        <div class="reticle tl"></div>
        <div class="reticle tr"></div>
        <div class="reticle bl"></div>
        <div class="reticle br"></div>
        <div class="scanline paused" id="scanline"></div>
        <div class="viewport-controls">
          <button class="vp-btn primary" id="startBtn"><i class="ti ti-player-play"></i>Start</button>
          <button class="vp-btn" id="stopBtn"><i class="ti ti-player-stop"></i>Stop</button>
        </div>
      </div>
    </div>

    <div class="inspector">
      <div class="inspector-section">
        <p class="inspector-title">Live readout</p>
        <div class="stat-row"><span class="label">Status</span><span class="value" id="statStatus">Idle</span></div>
        <div class="stat-row"><span class="label">Objects</span><span class="value accent" id="statObjects">0</span></div>
        <div class="stat-row"><span class="label">Latency</span><span class="value" id="statLatency">— ms</span></div>
        <div class="stat-row"><span class="label">Model</span><span class="value" id="statModel">yolo11n</span></div>
      </div>

      <div class="inspector-section">
        <p class="inspector-title">Detection settings</p>
        <div class="field">
          <div class="field-label"><span>Confidence</span><span class="field-value" id="confVal">0.50</span></div>
          <input type="range" id="confSlider" min="0.05" max="0.95" step="0.05" value="0.5">
        </div>
        <div class="field">
          <div class="field-label"><span>IoU threshold</span><span class="field-value" id="iouVal">0.45</span></div>
          <input type="range" id="iouSlider" min="0.10" max="0.90" step="0.05" value="0.45">
        </div>
        <div class="toggle-row">
          <span>Show labels</span>
          <div class="switch on" id="labelsToggle"></div>
        </div>
        <div class="toggle-row">
          <span>Show confidence</span>
          <div class="switch on" id="confToggle"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="console">
    <div class="console-header">
      <span>Console</span>
      <span id="consoleClear" style="cursor:pointer;"><i class="ti ti-trash"></i></span>
    </div>
    <div class="console-body" id="consoleBody"></div>
  </div>

<script>
const API_BASE = '/api/v1/object-detection';
const streamImg = document.getElementById('streamImg');
const viewportPlaceholder = document.getElementById('viewportPlaceholder');
const scanline = document.getElementById('scanline');
const consoleBody = document.getElementById('consoleBody');

let statusPoll = null;

function log(msg, level) {
  const line = document.createElement('div');
  line.className = 'console-line' + (level ? ' ' + level : '');
  const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
  line.innerHTML = '<span class="ts">' + ts + '</span><span class="msg">' + msg + '</span>';
  consoleBody.appendChild(line);
  consoleBody.scrollTop = consoleBody.scrollHeight;
}

async function apiPost(path, body) {
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  return res.json();
}

async function apiGet(path) {
  const res = await fetch(API_BASE + path);
  return res.json();
}

async function startDetection() {
  log('Starting object detection…');
  const result = await apiPost('/start');
  if (result.success) {
    streamImg.src = API_BASE + '/stream?t=' + Date.now();
    streamImg.style.display = 'block';
    viewportPlaceholder.style.display = 'none';
    scanline.classList.remove('paused');
    document.getElementById('statStatus').textContent = 'Running';
    log('Object detection started', 'ok');
    beginPolling();
  } else {
    log('Failed to start: ' + (result.error || 'unknown error'), 'warn');
  }
}

async function stopDetection() {
  const result = await apiPost('/stop');
  streamImg.style.display = 'none';
  viewportPlaceholder.style.display = 'flex';
  scanline.classList.add('paused');
  document.getElementById('statStatus').textContent = 'Idle';
  log('Object detection stopped');
  stopPolling();
}

function beginPolling() {
  if (statusPoll) return;
  statusPoll = setInterval(async () => {
    try {
      const status = await apiGet('/status');
      if (status.error) return;
      const settings = status.settings || {};
      document.getElementById('statModel').textContent = settings.model_id || '—';
      if (status.telemetry) {
        document.getElementById('statObjects').textContent = status.telemetry.objects_count;
        document.getElementById('statLatency').textContent = status.telemetry.latency_ms.toFixed(1) + " ms";
      }
    } catch (e) { /* status endpoint not ready yet */ }
  }, 1500);
}

function stopPolling() {
  if (statusPoll) { clearInterval(statusPoll); statusPoll = null; }
}

document.getElementById('startBtn').addEventListener('click', startDetection);
document.getElementById('stopBtn').addEventListener('click', stopDetection);

const confSlider = document.getElementById('confSlider');
const confVal = document.getElementById('confVal');
confSlider.addEventListener('input', () => { confVal.textContent = parseFloat(confSlider.value).toFixed(2); });
confSlider.addEventListener('change', async () => {
  await apiPost('/settings', { confidence: parseFloat(confSlider.value) });
  log('Confidence set to ' + confSlider.value);
});

const iouSlider = document.getElementById('iouSlider');
const iouVal = document.getElementById('iouVal');
iouSlider.addEventListener('input', () => { iouVal.textContent = parseFloat(iouSlider.value).toFixed(2); });
iouSlider.addEventListener('change', async () => {
  await apiPost('/settings', { iou: parseFloat(iouSlider.value) });
  log('IoU threshold set to ' + iouSlider.value);
});

function wireToggle(id, settingKey) {
  const el = document.getElementById(id);
  el.addEventListener('click', async () => {
    el.classList.toggle('on');
    const value = el.classList.contains('on');
    await apiPost('/settings', { [settingKey]: value });
    log(settingKey + ' set to ' + value);
  });
}
wireToggle('labelsToggle', 'show_labels');
wireToggle('confToggle', 'show_conf');

document.getElementById('consoleClear').addEventListener('click', () => { consoleBody.innerHTML = ''; });

log('Pi Vision AI workspace ready');
log('Object detection module registered', 'ok');
</script>

</body>
</html>
